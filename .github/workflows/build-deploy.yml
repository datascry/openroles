name: Build + deploy

# Build SQLite + static site + deploy to GitHub Pages, using the LATEST
# successful Scrape workflow's artifacts. Decoupled from Scrape so that
# code-only iterations (site templates, build-db, schema) don't require
# a 60-min re-scrape — just dispatch this and the last fresh scrape data
# is reused.
#
# Triggers:
#   1. workflow_run on Scrape success → auto-chain after the daily scrape
#   2. workflow_dispatch → operator-driven rebuild (e.g. after a site code push)
#
# Notably NOT push: main — code reviews / experimentation shouldn't
# auto-deploy. Operators dispatch explicitly when they want a deploy.

on:
  workflow_run:
    workflows: ["Scrape"]
    types: [completed]
  workflow_dispatch:
    inputs:
      scrape-run-id:
        description: "Scrape workflow run ID to pull artifacts from (default: latest successful)"
        type: string
        required: false
      deploy:
        description: "Deploy to GitHub Pages after build (default: true)"
        type: boolean
        default: true

concurrency:
  # Serialize across triggers so a manual dispatch and the auto-chain don't
  # race the Pages deploy. Group is workflow-wide (no `${{ github.ref }}`)
  # because there is only one Pages site.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # needed to read the upstream Scrape run's artifacts

env:
  BUN_VERSION: "1.3.13"

jobs:
  build:
    name: Build SQLite + site
    runs-on: ubuntu-24.04
    # Skip when the upstream Scrape run failed or was cancelled.
    # workflow_dispatch fires even when scrape failed, so the operator
    # can force a rebuild from the last good scrape.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    timeout-minutes: 60
    outputs:
      short_sha: ${{ steps.identity.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Resolve build identity
        id: identity
        run: |
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "BUILD_SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"

      # Resolve which Scrape run to pull artifacts from:
      #   - workflow_run trigger: github.event.workflow_run.id (the run that just finished)
      #   - workflow_dispatch with scrape-run-id input: that exact run
      #   - workflow_dispatch without input: latest successful Scrape run
      - name: Resolve scrape run id
        id: scrape-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          elif [ -n "${{ inputs.scrape-run-id }}" ]; then
            run_id="${{ inputs.scrape-run-id }}"
          else
            run_id="$(gh api 'repos/${{ github.repository }}/actions/workflows/scrape.yml/runs?status=success&per_page=1' --jq '.workflow_runs[0].id')"
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "::error::no successful Scrape run found; dispatch Scrape first"
              exit 1
            fi
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "using scrape run id: ${run_id}"

      - name: Download every scrape-* artifact
        uses: actions/download-artifact@v7
        with:
          path: data/scrape-outputs
          pattern: scrape-*
          merge-multiple: true
          # Cross-workflow access requires both the repo coordinates and
          # an actions:read token; default GITHUB_TOKEN has it via the
          # job's `permissions` block above.
          repository: ${{ github.repository }}
          run-id: ${{ steps.scrape-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Summarize scrape outputs
        run: |
          # Useful for triage when one matrix leg silently produced nothing —
          # the build still proceeds (the site renders the rest), but the
          # log records which ATSes were skipped today.
          shopt -s nullglob
          files=(data/scrape-outputs/*.json)
          echo "scrape outputs collected: ${#files[@]}"
          for f in "${files[@]}"; do
            count="$(jq '.jobs | length' "$f" 2>/dev/null || echo 0)"
            printf '  %-20s %s jobs\n' "$(basename "$f" .json)" "$count"
          done

      - name: Merge tenant lists for build-db
        run: |
          jq -s 'add' data/tenants/*.json > data/tenants-merged.json

      # Phase 12 carry-forward: download the previous build's SQLite from
      # the live Pages deployment so build-db can keep stale roles alive
      # for STALE_TTL_DAYS_DEFAULT before dropping them. Non-fatal — first
      # ever build has no previous, and a transient fetch failure should
      # not abort the whole refresh. See specs/role-lifecycle.md.
      - name: Download previous build's SQLite (for carry-forward)
        id: previous-db
        env:
          PAGES_BASE: "https://datascry.github.io/openroles"
        run: |
          set +e
          mkdir -p data/previous
          if ! curl -fsSL --max-time 30 "${PAGES_BASE}/data/manifest.json" -o data/previous/manifest.json; then
            echo "::notice::no live manifest at ${PAGES_BASE}/data/manifest.json — first-run carry-forward will be empty"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev_db_filename="$(jq -r '.db_filename' data/previous/manifest.json 2>/dev/null)"
          if [ -z "$prev_db_filename" ] || [ "$prev_db_filename" = "null" ]; then
            echo "::warning::live manifest missing db_filename; carry-forward skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! curl -fsSL --max-time 300 "${PAGES_BASE}/data/${prev_db_filename}" -o "data/previous/${prev_db_filename}"; then
            echo "::warning::could not fetch ${prev_db_filename}; carry-forward skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous_db_path=data/previous/${prev_db_filename}" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "carry-forward: previous SQLite at data/previous/${prev_db_filename} ($(wc -c < data/previous/${prev_db_filename}) bytes)"

      - name: Build SQLite database
        env:
          PREV_DB_PATH: ${{ steps.previous-db.outputs.previous_db_path }}
          PREV_DB_AVAILABLE: ${{ steps.previous-db.outputs.available }}
        run: |
          previous_arg=""
          if [ "$PREV_DB_AVAILABLE" = "true" ] && [ -n "$PREV_DB_PATH" ]; then
            previous_arg="--previous-db ${GITHUB_WORKSPACE}/${PREV_DB_PATH}"
          fi
          # shellcheck disable=SC2086
          bun run build-db \
            --input "${GITHUB_WORKSPACE}/data/scrape-outputs" \
            --tenants "${GITHUB_WORKSPACE}/data/tenants-merged.json" \
            --short-sha "$BUILD_SHORT_SHA" \
            --output-dir "${GITHUB_WORKSPACE}/data" \
            $previous_arg

      - name: Run drift report (non-fatal)
        run: |
          cp data/manifest.json data/scrape-outputs/manifest.json
          bun run report \
            --input "${GITHUB_WORKSPACE}/data/scrape-outputs" \
            --output "${GITHUB_WORKSPACE}/data/run-report.md" \
            --fail-on error || echo "::warning::drift report flagged regressions; see artifact"

      - name: Stage SQLite chunks + slim index + manifest for runtime fetch
        run: |
          # build-db emits three artifact families that the deployed
          # site fetches at runtime:
          #
          #   1. data/jobs.<sha>.sqlite.NNN.png — fixed-size (10 MB)
          #      slices of the SQLite file, used by sql.js-httpvfs's
          #      serverMode=chunked path. The .png extension defeats
          #      Fastly's automatic gzip on application/octet-stream
          #      (gzipped Range responses return compressed bytes which
          #      sql.js reads as garbage). See scripts/copy-sqlite-vfs.ts.
          #      Only the role-detail page touches this path now.
          #
          #   2. data/slim/slim-NNNN-<sha>.json.gz — pre-gzipped slim
          #      index chunks (~50k rows each, ~700 KB gzipped). The
          #      FilterTable progressively loads these into memory
          #      and runs all filter / sort / search interactions
          #      client-side — sub-50 ms after the chunk lands.
          #      Content-hashed filenames make them safe to cache
          #      forever via a Service Worker; the manifest is the
          #      only mutable URL.
          #
          #   3. data/manifest.json — atomic pointer to (1) and (2).
          #
          # We do not ship the full unsplit .sqlite — it would double
          # the artifact size for no runtime benefit.
          mkdir -p site/public/data/slim site/public/data/search
          cp data/manifest.json site/public/data/manifest.json
          cp data/jobs.${BUILD_SHORT_SHA}.sqlite.*.png site/public/data/
          if compgen -G 'data/slim/slim-*.json.gz' > /dev/null; then
            cp data/slim/slim-*.json.gz site/public/data/slim/
          fi
          if [ -f data/search/title-tokens.json.gz ]; then
            cp data/search/title-tokens.json.gz site/public/data/search/title-tokens.json.gz
          fi
          echo "=== top-level data/ ==="
          ls -lh site/public/data/ | head -8
          echo "=== slim chunks (first 5) ==="
          ls -lh site/public/data/slim/ | head -7
          echo "=== search index ==="
          ls -lh site/public/data/search/ 2>/dev/null || echo "(no search index)"

      - name: Build static site
        env:
          OPENROLES_DATA_DIR: ${{ github.workspace }}/data
        run: bun run build

      - name: Upload run report + manifest as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report-${{ steps.identity.outputs.short_sha }}
          path: |
            data/manifest.json
            data/run-report.md
          retention-days: 30

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'workflow_run' || inputs.deploy }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.event_name == 'workflow_run' || inputs.deploy }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
