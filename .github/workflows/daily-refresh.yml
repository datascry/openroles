name: Daily refresh

on:
  schedule:
    # 05:17 UTC daily — off-the-hour to avoid GitHub Actions schedule herding.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages after build (default: true)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BUN_VERSION: "1.3.13"
  CONTACT_URL: "https://github.com/datascry/openroles"
  USER_AGENT: "openroles/1.0.0 (+https://github.com/datascry/openroles)"

jobs:
  # One matrix job per ATS so scrape time is `max(per_ats)` rather than
  # `sum(per_ats)`. Sequential execution previously hit the 60-minute
  # runner timeout once tenant counts grew past ~15k across all ATSes.
  scrape:
    name: Scrape ${{ matrix.ats }}
    runs-on: ubuntu-24.04
    # 60 min: post-bootstrap corpus pushed icims (14,810 tenants) past
    # the previous 45-min cap. Other large per-subdomain ATSes
    # (bamboohr 15,840; workable 14,392) finished in ~30-40 min and
    # are at risk too. 60 keeps headroom; longer-term icims should
    # shard by tenant prefix.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ats:
          - greenhouse
          - lever
          - ashby
          - bamboohr
          - workday
          - icims
          - recruitee
          - breezy
          - personio
          - workable
          - teamtailor
          - smartrecruiters
          - csod
          - taleo
          - ultipro
          - jobvite
          - zohorecruit
          - talentlyft
          - pinpointhq
          - applicantpro
          - applicantstack
          - homerun
          - factorial
          - eightfold
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build scrape input for ${{ matrix.ats }}
        id: input
        run: |
          # First-run safety: if weekly-harvest hasn't populated this ATS's
          # tenant list yet, skip the scrape with a notice instead of failing.
          # The downstream build job tolerates a missing scrape output and
          # builds an empty section for that ATS.
          tenants_file="data/tenants/${{ matrix.ats }}.json"
          if [ ! -s "$tenants_file" ]; then
            echo "::notice::${tenants_file} missing or empty — run weekly-harvest.yml to seed it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live="$(jq '[.[] | select(.status == "live")] | length' "$tenants_file")"
          if [ "$live" -eq 0 ]; then
            echo "::notice::${{ matrix.ats }}: 0 live tenants in ${tenants_file} — skipping scrape"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p data/scrape-inputs data/scrape-outputs
          jq --arg ats "${{ matrix.ats }}" --arg ua "$USER_AGENT" --arg contact "$CONTACT_URL" '
            {
              ats: $ats,
              userAgent: $ua,
              contactUrl: $contact,
              concurrency: 8,
              retry: { maxAttempts: 3, baseMs: 500, maxMs: 30000 },
              tenants: [
                .[]
                | select(.status == "live")
                | (
                    if (.metadata // null) == null
                    then { slug: .slug }
                    else { slug: .slug, metadata: .metadata }
                    end
                  )
              ]
            }
          ' "$tenants_file" > "data/scrape-inputs/${{ matrix.ats }}.json"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "scrape ${{ matrix.ats }}: ${live} live tenants"

      - name: Scrape ${{ matrix.ats }}
        if: steps.input.outputs.skip != 'true'
        run: |
          # A single ATS's failure must not poison the rest of the matrix
          # (fail-fast is already false). We log a warning and exit 0 so the
          # job still uploads an artifact placeholder if there is one, and
          # the build job ignores the missing output.
          input="${GITHUB_WORKSPACE}/data/scrape-inputs/${{ matrix.ats }}.json"
          output="${GITHUB_WORKSPACE}/data/scrape-outputs/${{ matrix.ats }}.json"
          if ! bun run scrape --input "$input" --output "$output"; then
            echo "::warning::scrape ${{ matrix.ats }} failed; downstream build will skip this ATS"
            rm -f "$output"
          fi

      - name: Upload scrape output for ${{ matrix.ats }}
        if: steps.input.outputs.skip != 'true' && hashFiles(format('data/scrape-outputs/{0}.json', matrix.ats)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: scrape-${{ matrix.ats }}
          path: data/scrape-outputs/${{ matrix.ats }}.json
          retention-days: 7

  build:
    name: Build SQLite + site
    needs: scrape
    if: always()
    runs-on: ubuntu-24.04
    # 60 min: covers ~30-40k tenant pages (post-job_count>0 filter
    # in selectTenants) at ~13ms each plus build-db, drift, etc.
    # The role-detail page is client-rendered as of v3 so per-job
    # pages no longer factor in.
    timeout-minutes: 60
    outputs:
      short_sha: ${{ steps.identity.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Resolve build identity
        id: identity
        run: |
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "BUILD_SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"

      - name: Download every scrape-* artifact
        uses: actions/download-artifact@v7
        with:
          path: data/scrape-outputs
          pattern: scrape-*
          merge-multiple: true

      - name: Summarize scrape outputs
        run: |
          # Useful for triage when one matrix leg silently produced nothing —
          # the build still proceeds (the site renders the rest), but the
          # log records which ATSes were skipped today.
          shopt -s nullglob
          files=(data/scrape-outputs/*.json)
          echo "scrape outputs collected: ${#files[@]}"
          for f in "${files[@]}"; do
            count="$(jq '.jobs | length' "$f" 2>/dev/null || echo 0)"
            printf '  %-20s %s jobs\n' "$(basename "$f" .json)" "$count"
          done

      - name: Merge tenant lists for build-db
        run: |
          jq -s 'add' data/tenants/*.json > data/tenants-merged.json

      # Phase 12 carry-forward: download the previous build's SQLite from
      # the live Pages deployment so build-db can keep stale roles alive
      # for STALE_TTL_DAYS_DEFAULT before dropping them. Non-fatal — first
      # ever build has no previous, and a transient fetch failure should
      # not abort the whole refresh. See specs/role-lifecycle.md.
      - name: Download previous build's SQLite (for carry-forward)
        id: previous-db
        env:
          PAGES_BASE: "https://datascry.github.io/openroles"
        run: |
          set +e
          mkdir -p data/previous
          if ! curl -fsSL --max-time 30 "${PAGES_BASE}/data/manifest.json" -o data/previous/manifest.json; then
            echo "::notice::no live manifest at ${PAGES_BASE}/data/manifest.json — first-run carry-forward will be empty"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev_db_filename="$(jq -r '.db_filename' data/previous/manifest.json 2>/dev/null)"
          if [ -z "$prev_db_filename" ] || [ "$prev_db_filename" = "null" ]; then
            echo "::warning::live manifest missing db_filename; carry-forward skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! curl -fsSL --max-time 300 "${PAGES_BASE}/data/${prev_db_filename}" -o "data/previous/${prev_db_filename}"; then
            echo "::warning::could not fetch ${prev_db_filename}; carry-forward skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous_db_path=data/previous/${prev_db_filename}" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "carry-forward: previous SQLite at data/previous/${prev_db_filename} ($(wc -c < data/previous/${prev_db_filename}) bytes)"

      - name: Build SQLite database
        env:
          PREV_DB_PATH: ${{ steps.previous-db.outputs.previous_db_path }}
          PREV_DB_AVAILABLE: ${{ steps.previous-db.outputs.available }}
        run: |
          previous_arg=""
          if [ "$PREV_DB_AVAILABLE" = "true" ] && [ -n "$PREV_DB_PATH" ]; then
            previous_arg="--previous-db ${GITHUB_WORKSPACE}/${PREV_DB_PATH}"
          fi
          # shellcheck disable=SC2086
          bun run build-db \
            --input "${GITHUB_WORKSPACE}/data/scrape-outputs" \
            --tenants "${GITHUB_WORKSPACE}/data/tenants-merged.json" \
            --short-sha "$BUILD_SHORT_SHA" \
            --output-dir "${GITHUB_WORKSPACE}/data" \
            $previous_arg

      - name: Run drift report (non-fatal)
        run: |
          cp data/manifest.json data/scrape-outputs/manifest.json
          bun run report \
            --input "${GITHUB_WORKSPACE}/data/scrape-outputs" \
            --output "${GITHUB_WORKSPACE}/data/run-report.md" \
            --fail-on error || echo "::warning::drift report flagged regressions; see artifact"

      - name: Stage SQLite + manifest for runtime fetch
        run: |
          mkdir -p site/public/data
          cp data/manifest.json site/public/data/manifest.json
          cp "data/jobs.${BUILD_SHORT_SHA}.sqlite" site/public/data/

      - name: Build static site
        env:
          OPENROLES_DATA_DIR: ${{ github.workspace }}/data
        run: bun run build

      - name: Upload run report + manifest as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report-${{ steps.identity.outputs.short_sha }}
          path: |
            data/manifest.json
            data/run-report.md
          retention-days: 30

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'schedule' || inputs.deploy }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.event_name == 'schedule' || inputs.deploy }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
