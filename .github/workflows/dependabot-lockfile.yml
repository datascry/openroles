name: Dependabot bun.lock sync

# Dependabot updates package.json on npm dep bumps but never touches bun.lock,
# which leaves CI's `bun install --frozen-lockfile` rejecting the PR. This
# workflow regenerates bun.lock on dependabot PRs that change a package.json
# and commits it back to the PR branch so the rest of CI can run.
#
# pull_request_target is the standard pattern for autofixing dependabot PRs:
# it runs in the context of the base branch (so secrets + write token are
# available) but checks out the PR branch for the install. Filtered tightly
# to the dependabot actor so untrusted PRs never reach this code path.

on:
  pull_request_target:
    paths:
      - "package.json"
      - "**/package.json"

permissions:
  contents: write

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  sync:
    name: Regenerate bun.lock
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Regenerate bun.lock
        # --ignore-scripts blocks postinstall hooks from a hostile bump
        # before any human review — defense in depth alongside the
        # github.actor filter and the existing Bun audit job.
        run: bun install --ignore-scripts

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun.lock"
          git push
