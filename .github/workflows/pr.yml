name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  BUN_VERSION: "1.3.13"

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - name: Validate PR commits
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Lint + format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - run: bun run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - run: bun run typecheck

  test:
    name: Test + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - name: Run tests with coverage
        run: bun run test
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: E2E + a11y
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      # Playwright 1.50+ defaults to the chromium-headless-shell variant
      # in headless mode (separate binary from the full chromium build).
      # Installing only `chromium` leaves the headless-shell path missing,
      # which surfaces as `Executable doesn't exist at
      # .../chromium_headless_shell-<n>/...` and fails every spec. Install
      # both so spec launches and Lighthouse runs (which want the full
      # binary) both work.
      #
      # Run from `site/` so the playwright CLI resolves to
      # `site/node_modules/@playwright/test` (the version pinned in
      # site/package.json). A bare `bunx playwright install` from the
      # repo root falls through to bun's global cache and downloads the
      # newest published CLI, whose binary version (e.g. v1223) doesn't
      # match what `@playwright/test` looks for at runtime (e.g. v1217).
      # The mismatch wastes ~290 MB of download per run and then fails
      # every spec with "Executable doesn't exist at .../chromium_headless_shell-<workspace_v>".
      - run: bunx playwright install --with-deps chromium chromium-headless-shell
        working-directory: site
      - run: bun run build
      - run: bun run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

  size-limit:
    name: Bundle size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - run: bun run build
      - run: bun run size-limit

  # The Lighthouse audit runs as the "lighthouse" Playwright project, executed
  # by the e2e job above (`bun run e2e` runs every project, including this one).
  # Keeping it inside the Playwright runner means one webServer, one
  # globalSetup (so the fixture DB is loaded for the audit), and one set of
  # browser binaries to install — see site/tests/e2e/lighthouse.spec.ts.

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  bun-audit:
    name: Bun audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/bun-install
      - run: bun audit
