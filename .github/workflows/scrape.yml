name: Scrape

# Scrape-only workflow: runs the per-ATS matrix and uploads each leg's
# JSON output as an artifact. Does NOT build SQLite or deploy — that's
# `build-deploy.yml`, which auto-chains via `workflow_run` after this
# workflow completes successfully.
#
# This split exists for iteration speed: most code changes (site, db
# schema, build-db logic) don't require fresh scrape data; rebuilding
# from the last successful scrape's artifacts takes ~10 min instead of
# the full ~60-90 min pipeline.

on:
  schedule:
    # 05:17 UTC daily — off-the-hour to avoid GitHub Actions schedule herding.
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.13"
  CONTACT_URL: "https://github.com/datascry/openroles"
  USER_AGENT: "openroles/1.0.0 (+https://github.com/datascry/openroles)"

jobs:
  scrape:
    # Use matrix.total_shards as the "is sharded?" sentinel rather than
    # matrix.shard. GitHub Actions expressions evaluate `0 && X` as 0,
    # so for the shard-0 leg `matrix.shard && format(...)` would silently
    # drop the suffix and the two icims jobs would share the same name.
    # total_shards is non-null only on sharded matrix entries.
    name: Scrape ${{ matrix.ats }}${{ matrix.total_shards && format(' (shard {0}/{1})', matrix.shard, matrix.total_shards) || '' }}
    runs-on: ubuntu-24.04
    # 60 min: enough for every ATS now that icims is split into two
    # ~7,400-tenant shards running in parallel (each finishes in ~30
    # min). bamboohr (15,840 tenants) and workable (14,392) still fit
    # under 60 because their probe times are lower than icims's HTML
    # sitemap-walk. Bumping back from the 90-min stopgap that ran
    # before the shard split.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ats:
          - greenhouse
          - lever
          - ashby
          - bamboohr
          - workday
          - recruitee
          - breezy
          - personio
          - workable
          # teamtailor is sharded — see the include: block below.
          - smartrecruiters
          - csod
          - taleo
          - ultipro
          - jobvite
          - zohorecruit
          - talentlyft
          - pinpointhq
          - applicantpro
          - applicantstack
          - homerun
          - factorial
          - eightfold
          # Phase-5 successfactors adapter (multi-tenant SAP).
          - successfactors
          # Phase-6 per-company custom ATSes (single-tenant each).
          - amazonjobs
          - applejobs
          - tiktokcareers
          - metacareers
          # Vendor-agnostic JSON-LD harvester (TalentBrew-family brands).
          - jsonld
          # IBM Kenexa / BrassRing multi-tenant ATS.
          - brassring
          # Vendor-agnostic Google-for-Jobs RSS feed harvester.
          - gjobsfeed
          # Oracle Fusion HCM Candidate Experience (per-tenant Fusion pods).
          - oraclecloud
          # JazzHR hosted boards ({slug}.applytojob.com); shared backend.
          - jazzhr
          # Phenom personalised career sites (per-tenant vanity hosts).
          - phenom
        # icims (~14,810 tenants) and teamtailor (~1,624 tenants today
        # but each tenant requires its own subdomain TLS handshake, so
        # the per-tenant cost is higher than icims's JSON walk) both
        # hit the per-shard 60-min timeout on a single runner.
        # Splitting tenant lists across multiple parallel runners
        # (sum-of-codepoints mod N) lets each half finish well under
        # the cap. The downstream Build + deploy step downloads every
        # `scrape-*` artifact and merges them, so shard artifacts
        # (`scrape-icims-0`, `scrape-teamtailor-0`, etc.) coexist with
        # the unsharded legs.
        #
        # teamtailor was sharded after run 26983403586 timed out at
        # 60:14 with 1,624 live tenants @ concurrency=24 — the
        # workflow_dispatch retry would have hit the same wall.
        include:
          - ats: icims
            shard: 0
            total_shards: 2
          - ats: icims
            shard: 1
            total_shards: 2
          - ats: teamtailor
            shard: 0
            total_shards: 2
          - ats: teamtailor
            shard: 1
            total_shards: 2
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: ./.github/actions/bun-install

      - name: Build scrape input for ${{ matrix.ats }}
        id: input
        env:
          # Sharded matrix entries (currently only icims) carry shard +
          # total_shards. Non-sharded entries leave both unset; the
          # script uses 0 / 1 defaults so partition becomes a no-op.
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ matrix.total_shards }}
        run: |
          # SHARD_ID disambiguates artifacts and output filenames when an
          # ATS is split across multiple matrix entries.
          if [ -n "$SHARD" ]; then
            shard_id="${{ matrix.ats }}-${SHARD}"
          else
            shard_id="${{ matrix.ats }}"
          fi
          echo "shard_id=${shard_id}" >> "$GITHUB_OUTPUT"

          # First-run safety: if weekly-harvest hasn't populated this ATS's
          # tenant list yet, skip the scrape with a notice instead of failing.
          # The downstream build job tolerates a missing scrape output and
          # builds an empty section for that ATS.
          tenants_file="data/tenants/${{ matrix.ats }}.json"
          if [ ! -s "$tenants_file" ]; then
            echo "::notice::${tenants_file} missing or empty — run weekly-harvest.yml to seed it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Per-ATS scrape concurrency. The default was 8 across the board,
          # which is conservative for per-subdomain ATSes (every probe is a
          # different host, so high concurrency just runs more independent
          # TLS handshakes — the only per-host load is on whatever shared
          # CDN they happen to use, typically AWS ELB). Shared-host ATSes
          # (workable's apply.workable.com, jobvite's jobs.jobvite.com,
          # smartrecruiters' api.smartrecruiters.com, etc.) keep the lower
          # cap because bursting hits CDN rate-limits — workable's
          # cloudflare ip-banned us mid-bootstrap at default concurrency.
          case "${{ matrix.ats }}" in
            workable|jobvite|smartrecruiters|ultipro|greenhouse|lever|ashby|jazzhr)
              concurrency_value=4 ;;
            *)
              concurrency_value=24 ;;
          esac

          # Staleness filter: only scrape tenants whose last_probed_at is
          # within the last 30 days. The reprobe pass marks NXDOMAIN /
          # decommissioned tenants as `dead`, but pre-bootstrap rows with
          # status=`live` from years ago may have rotted DNS. Each one
          # costs ~1-3 sec of TLS handshake / connect timeout if the
          # subdomain is gone. 30 days gives a generous probe-cadence
          # buffer (reprobe runs weekly).
          #
          # Compare ISO-8601 strings directly — they sort correctly by
          # timestamp, and jq's fromdateiso8601 chokes on fractional
          # seconds (".833Z" suffix in our data) so the previous numeric
          # comparison failed every job.
          cutoff_iso="$(date -u -d "30 days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || python3 -c 'from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)-timedelta(days=30)).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          # Shard partition: when total_shards>1, only keep tenants whose
          # slug hashes (sum of unicode codepoints) into the assigned
          # bucket. Deterministic, doesn't require external tools, and
          # gives a near-50/50 split for any reasonably-distributed slug
          # corpus. Non-sharded entries default total_shards=1, shard=0,
          # which keeps every tenant.
          shard_n="${SHARD:-0}"
          total_n="${TOTAL_SHARDS:-1}"
          live="$(jq --arg cutoff "$cutoff_iso" \
                    --argjson shard "$shard_n" \
                    --argjson total "$total_n" '
            [.[] | select(
              .status == "live" and
              ((.last_probed_at // "1970-01-01T00:00:00Z") > $cutoff) and
              ((.slug | explode | add) % $total == $shard)
            )] | length
          ' "$tenants_file")"
          if [ "$live" -eq 0 ]; then
            echo "::notice::${shard_id}: 0 live tenants probed since ${cutoff_iso} — skipping scrape"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p data/scrape-inputs data/scrape-outputs
          jq --arg ats "${{ matrix.ats }}" \
             --arg ua "$USER_AGENT" \
             --arg contact "$CONTACT_URL" \
             --argjson concurrency "$concurrency_value" \
             --arg cutoff "$cutoff_iso" \
             --argjson shard "$shard_n" \
             --argjson total "$total_n" '
            {
              ats: $ats,
              userAgent: $ua,
              contactUrl: $contact,
              concurrency: $concurrency,
              retry: { maxAttempts: 3, baseMs: 500, maxMs: 30000 },
              tenants: [
                .[]
                | select(
                    .status == "live" and
                    ((.last_probed_at // "1970-01-01T00:00:00Z") > $cutoff) and
                    ((.slug | explode | add) % $total == $shard)
                  )
                | (
                    if (.metadata // null) == null
                    then { slug: .slug }
                    else { slug: .slug, metadata: .metadata }
                    end
                  )
              ]
            }
          ' "$tenants_file" > "data/scrape-inputs/${shard_id}.json"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "scrape ${shard_id}: ${live} live tenants (concurrency=${concurrency_value}, shard=${shard_n}/${total_n})"

      - name: Scrape ${{ matrix.ats }}
        if: steps.input.outputs.skip != 'true'
        env:
          SHARD_ID: ${{ steps.input.outputs.shard_id }}
        run: |
          # A single ATS's failure must not poison the rest of the matrix
          # (fail-fast is already false). We log a warning and exit 0 so the
          # job still uploads an artifact placeholder if there is one, and
          # the build job ignores the missing output.
          input="${GITHUB_WORKSPACE}/data/scrape-inputs/${SHARD_ID}.json"
          output="${GITHUB_WORKSPACE}/data/scrape-outputs/${SHARD_ID}.json"
          if ! bun run scrape --input "$input" --output "$output"; then
            echo "::warning::scrape ${SHARD_ID} failed; downstream build will skip this shard"
            rm -f "$output"
          fi

      - name: Upload scrape output for ${{ matrix.ats }}
        if: steps.input.outputs.skip != 'true' && hashFiles(format('data/scrape-outputs/{0}.json', steps.input.outputs.shard_id)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: scrape-${{ steps.input.outputs.shard_id }}
          path: data/scrape-outputs/${{ steps.input.outputs.shard_id }}.json
          retention-days: 7
