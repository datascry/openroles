name: Weekly harvest

on:
  schedule:
    # 02:43 UTC every Monday — off-the-hour to avoid schedule herding.
    - cron: "43 2 * * 1"
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Comma-separated CC-MAIN snapshot ids (YYYY-NN). Default: latest 40 from collinfo.json (~4 years)."
        required: false
        type: string
      probe:
        description: "Probe each candidate for liveness (slow). Default: true."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.13"
  CONTACT_URL: "https://github.com/datascry/openroles"
  USER_AGENT: "openroles/1.0.0 (+https://github.com/datascry/openroles)"

jobs:
  # One matrix leg per ATS, each on its own runner with its own outbound
  # IP. Sequential single-runner harvests previously hit Common Crawl's
  # IP-rate-limit after the first 4 ATSes (run 25193840474: bamboohr's
  # 24-minute crawl exhausted the quota; workday onward all failed at
  # CLI startup with "socket closed" / "operation timed out"). Matrix
  # gives each ATS independent CC quota and turns total runtime from
  # sum(per_ats) ~3 hours into max(per_ats) ~30 min.
  harvest:
    name: Harvest ${{ matrix.ats }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ats:
          - greenhouse
          - lever
          - ashby
          - bamboohr
          - workday
          - icims
          - recruitee
          - breezy
          - personio
          - workable
          - teamtailor
          - smartrecruiters
          - csod
          - taleo
          - ultipro
          - jobvite
          - zohorecruit
          - talentlyft
          - pinpointhq
          - applicantpro
          - applicantstack
          - homerun
          - factorial
          - eightfold
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Harvest ${{ matrix.ats }}
        env:
          PROBE_INPUT: ${{ inputs.probe }}
          SNAPSHOTS_INPUT: ${{ inputs.snapshots }}
        run: |
          mkdir -p data/tenants
          probe_flag=""
          if [ "$PROBE_INPUT" = "false" ]; then probe_flag="--skip-probe"; fi
          # Validate snapshots input shape before splatting it into argv —
          # the dispatch input is otherwise free-form and could re-flag args.
          snap_flag=""
          if [ -n "$SNAPSHOTS_INPUT" ]; then
            if ! printf '%s' "$SNAPSHOTS_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}(,[0-9]{4}-[0-9]{2})*$'; then
              echo "::error::snapshots input must match YYYY-NN(,YYYY-NN)*; got: $SNAPSHOTS_INPUT"
              exit 1
            fi
            snap_flag="--snapshots=$SNAPSHOTS_INPUT"
          fi
          # shellcheck disable=SC2086
          bun run harvest \
            --ats "${{ matrix.ats }}" \
            --user-agent "$USER_AGENT" \
            --output-dir "${GITHUB_WORKSPACE}/data" \
            $probe_flag $snap_flag

      - name: Upload tenants for ${{ matrix.ats }}
        if: hashFiles(format('data/tenants/{0}.json', matrix.ats)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: tenants-${{ matrix.ats }}
          path: data/tenants/${{ matrix.ats }}.json
          retention-days: 14

  commit:
    name: Aggregate + commit tenant lists
    needs: harvest
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download every tenants-* artifact
        uses: actions/download-artifact@v7
        with:
          path: data/tenants
          pattern: tenants-*
          merge-multiple: true

      - name: Show diff summary
        run: |
          echo "## Tenant list diffs" >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          for file in data/tenants/*.json; do
            ats="$(basename "$file" .json)"
            count="$(jq 'length' "$file" 2>/dev/null || echo 0)"
            live="$(jq '[.[] | select(.status == "live")] | length' "$file" 2>/dev/null || echo 0)"
            echo "- **${ats}**: ${count} tenants (${live} live)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Commit updated tenant lists
        run: |
          if [ -z "$(git status --porcelain data/tenants/)" ]; then
            echo "no tenant changes; skipping commit"
            exit 0
          fi
          git config user.name "openroles-bot"
          git config user.email "openroles-bot@users.noreply.github.com"
          git add data/tenants/
          git commit -m "chore(harvest): refresh tenant lists [skip ci]"
          # Harvest legs run for 5-30 minutes; main may move during that
          # window when other workflows commit or PR merges land. Plain push
          # then loses the harvest commit. Pull --rebase + retry handles the
          # concurrent-update case; tenant edits live entirely under
          # data/tenants/ which nothing else writes, so rebase is conflict-free.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then
              echo "push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected on attempt ${attempt}; will retry"
            sleep 5
          done
          echo "::error::could not push tenant updates after 3 attempts"
          exit 1
