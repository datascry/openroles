# Bun configuration — https://bun.sh/docs/runtime/bunfig

[install]
# Pin to exact versions when running `bun add` — every dep in package.json
# must be an exact version, not a range. Lockfile is the source of truth.
exact = true
peer = true
frozenLockfile = false

[install.cache]
disable = false

[test]
coverage = true
coverageThreshold = 0.95
coverageReporter = ["text", "lcov"]
coveragePathIgnorePatterns = [
  "**/*.d.ts",
  "**/*.test.ts",
  "**/tests/**",
  "**/bin/**",
  "**/migrations/*.sql",
  "node_modules/**",
  "dist/**",
  ".astro/**",
  "coverage/**",
  # Browser-only fetch + Web Worker code; bun:test cannot exercise it.
  # Covered by Playwright e2e in tests/e2e/slim-index.spec.ts.
  "**/slim-index-loader.ts",
]
coverageDir = "coverage"
bail = 0
