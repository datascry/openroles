server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # Build redirects with the request's host:port instead of server_name:port.
    absolute_redirect off;

    # nginx serves byte-range requests for static files by default.
    # sql.js-httpvfs depends on Range support against the .sqlite blob.

    location = / {
        return 302 /openroles/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # SQLite must never be transformed in flight.
    location ~* \.sqlite$ {
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml;
}
